<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="oi.css">
    <meta charset="UTF-8">
    <title>Monitor de Qualidade do Ar</title>


</head>

<body>

    <h1>Monitor de Qualidade<br>do Ar
    </h1>

    <p>Insira os dados do ambiente para medir a<br>qualidade do ar.</p>

    <label>Temperatura (°C)</label>

    <input id="Temperatura" type="number" placeholder="Ex: 24">

    <label>Partículas no ar – PM2.5 (µg/m³)</label>

    <input id="Partículas" type="number" placeholder="Ex: 35">

    <label>Umidade (%)</label>

    <input id="Umidade" type="number" placeholder="Ex: 55">

    <br>

    <button id="botão">Medir qualidade do ar</button>
    <script src="projeto2.js"></script>

</body>

</html>
